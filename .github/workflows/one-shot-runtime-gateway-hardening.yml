name: NXQ Runtime Gateway Hardening

on:
  push:
    branches:
      - safe/checkpoint-autonomy-wave35-sales
    paths:
      - .github/workflows/one-shot-runtime-gateway-hardening.yml
      - scripts/patch-runtime-gateway-hardening.py
      - scripts/validate-runtime-error-surface-contract.mjs

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/checkpoint-autonomy-wave35-sales
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply gateway/auth alignment patch
        run: python scripts/patch-runtime-gateway-hardening.py
      - name: Install dependencies
        run: npm ci
      - name: Validate runtime staging boundaries
        run: npm run test:runtime-stage
      - name: Audit runtime error surfaces
        run: node scripts/validate-runtime-error-surface-contract.mjs
      - name: Type-check every Edge function
        run: npm run test:edge
      - name: Zero-warning lint
        run: npm run lint -- --max-warnings=0
      - name: Commit hardened runtime files
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            scripts/edge-function-manifest.mjs
            supabase/config.toml
            supabase/functions/build-business-location-pages/index.ts
            supabase/functions/build-business-seo-artifacts/index.ts
            supabase/functions/run-website-maintenance/index.ts
            supabase/functions/provision-project-infrastructure/index.ts
            supabase/functions/build-business-website/index.ts
          )
          git diff --check
          if git diff --quiet -- "${targets[@]}"; then
            echo "No runtime hardening changes required."
            exit 0
          fi
          git config user.name "NXQ Safe CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${targets[@]}"
          git commit -m "fix: harden runtime provider error paths"
          git push origin HEAD:safe/checkpoint-autonomy-wave35-sales
