name: NXQ Safe CI

on:
  push:
    branches:
      - safe/commerce-live-storefront
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Fail if validation failed
        if: steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "Validation failed. Lint: ${{ steps.lint.outcome }} | Build: ${{ steps.build.outcome }}"
          exit 1
