name: NXQ Safe CI

on:
  push:
    branches:
      - safe/commerce-live-storefront
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provisioning contract
        id: provisioning_contract
        continue-on-error: true
        run: node scripts/validate-storefront-provisioning-contract.mjs

      - name: Automation routing contract
        id: automation_routing_contract
        continue-on-error: true
        run: node scripts/validate-automation-routing-contract.mjs

      - name: Lint with zero warnings
        id: lint
        continue-on-error: true
        run: npm run lint -- --max-warnings=0

      - name: Production dependency audit
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Fail if validation failed
        if: steps.provisioning_contract.outcome == 'failure' || steps.automation_routing_contract.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "Validation failed. Provisioning contract: ${{ steps.provisioning_contract.outcome }} | Automation routing: ${{ steps.automation_routing_contract.outcome }} | Lint: ${{ steps.lint.outcome }} | Audit: ${{ steps.audit.outcome }} | Build: ${{ steps.build.outcome }}"
          exit 1
