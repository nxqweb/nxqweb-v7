name: NXQ Manual Supabase Stage

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose validation or explicit runtime mutation"
        required: true
        default: validate_foundation
        type: choice
        options:
          - validate_foundation
          - validate_non_ai
          - validate_zero_key
          - validate_prelaunch
          - validate
          - apply_migrations
          - deploy_functions
          - deploy_provider_readiness
          - configure_internal_provider_adapters
          - deploy_zero_netlify_readiness
          - run_evidence_suite
          - dispatch_workers
          - apply_all
      confirmation:
        description: "For mutation actions type APPLY-NXQ-SUPABASE-STAGING exactly"
        required: false
        type: string

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: nxq-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      NXQ_AUTOMATION_WORKER_TOKEN: ${{ secrets.NXQ_AUTOMATION_WORKER_TOKEN }}
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked tooling
        run: npm ci

      - name: Validate deployment manifest and auth boundaries
        run: npm run test:runtime-stage

      - name: Require protected configuration
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          if [ "${{ inputs.action }}" = "dispatch_workers" ] || [ "${{ inputs.action }}" = "run_evidence_suite" ]; then
            test -n "$NXQ_AUTOMATION_WORKER_TOKEN" || { echo "Missing NXQ_AUTOMATION_WORKER_TOKEN"; exit 1; }
          fi

      - name: Link project
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migration dry run
        run: npx --no-install supabase db push --dry-run --linked

      - name: Verify staging Edge secret names
        if: inputs.action == 'validate_foundation' || inputs.action == 'validate_non_ai' || inputs.action == 'validate_zero_key' || inputs.action == 'validate_prelaunch' || inputs.action == 'validate' || inputs.action == 'deploy_functions' || inputs.action == 'apply_all'
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output-format json > "$RUNNER_TEMP/nxq-supabase-secrets.json"
          if [ "${{ inputs.action }}" = "validate_foundation" ]; then
            node scripts/check-runtime-stage-readiness.mjs --profile=business-configured-foundation --supabase-secrets-json="$RUNNER_TEMP/nxq-supabase-secrets.json"
          elif [ "${{ inputs.action }}" = "validate_non_ai" ] || [ "${{ inputs.action }}" = "deploy_functions" ]; then
            node scripts/check-runtime-stage-readiness.mjs --profile=business-non-ai-staging --supabase-secrets-json="$RUNNER_TEMP/nxq-supabase-secrets.json"
          elif [ "${{ inputs.action }}" = "validate_zero_key" ]; then
            node scripts/check-runtime-stage-readiness.mjs --profile=business-zero-key-staging --supabase-secrets-json="$RUNNER_TEMP/nxq-supabase-secrets.json"
          elif [ "${{ inputs.action }}" = "validate_prelaunch" ]; then
            node scripts/check-runtime-stage-readiness.mjs --profile=business-prelaunch --supabase-secrets-json="$RUNNER_TEMP/nxq-supabase-secrets.json"
          else
            node scripts/check-runtime-stage-readiness.mjs --profile=business-external-qa --supabase-secrets-json="$RUNNER_TEMP/nxq-supabase-secrets.json"
          fi

      - name: Require explicit mutation confirmation
        if: inputs.action != 'validate_foundation' && inputs.action != 'validate_non_ai' && inputs.action != 'validate_zero_key' && inputs.action != 'validate_prelaunch' && inputs.action != 'validate'
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "APPLY-NXQ-SUPABASE-STAGING" ]; then
            echo "Mutation refused. Exact confirmation phrase is required."
            exit 1
          fi

      - name: Apply migrations
        if: inputs.action == 'apply_migrations' || inputs.action == 'apply_all'
        run: npx --no-install supabase db push --linked

      - name: Deploy custom-auth and public-ingest functions
        if: inputs.action == 'deploy_functions' || inputs.action == 'apply_all'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t functions < <(node scripts/edge-function-manifest.mjs --group=no-verify-jwt)
          for fn in "${functions[@]}"; do
            echo "Deploying $fn with its independent source-level authentication boundary..."
            npx --no-install supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done

      - name: Deploy Supabase-JWT authenticated functions
        if: inputs.action == 'deploy_functions' || inputs.action == 'apply_all'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t functions < <(node scripts/edge-function-manifest.mjs --group=verify-jwt)
          for fn in "${functions[@]}"; do
            echo "Deploying $fn with Supabase JWT verification enabled..."
            npx --no-install supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Verify complete remote function coverage
        if: inputs.action == 'deploy_functions' || inputs.action == 'apply_all'
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output-format json > "$RUNNER_TEMP/nxq-supabase-functions.json"
          node scripts/check-runtime-stage-readiness.mjs --supabase-functions-json="$RUNNER_TEMP/nxq-supabase-functions.json"

      - name: Deploy zero-Netlify readiness functions only
        if: inputs.action == 'deploy_zero_netlify_readiness'
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            build-business-seo-artifacts
            reconcile-domain
            run-staging-evidence-suite
            run-website-maintenance
          )
          for fn in "${functions[@]}"; do
            echo "Deploying scoped zero-Netlify readiness function: $fn"
            npx --no-install supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done

      - name: Deploy provider-readiness functions only
        if: inputs.action == 'deploy_provider_readiness'
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            bootstrap-runtime-vault
            check-provider-health
            dispatch-notifications
            malware-scan-provider-adapter
            notification-provider-adapter
            scan-client-file
          )
          for fn in "${functions[@]}"; do
            echo "Deploying scoped provider-readiness function: $fn"
            if [ "$fn" = "bootstrap-runtime-vault" ]; then
              npx --no-install supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            else
              npx --no-install supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            fi
          done

      - name: Configure internal provider adapters only
        if: inputs.action == 'configure_internal_provider_adapters'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/nxq-internal-provider-adapters.env"
          secret_names_file="$RUNNER_TEMP/nxq-supabase-secrets.json"
          trap 'rm -f "$secrets_file" "$secret_names_file"' EXIT

          function_base_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          notification_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          malware_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          provider_health_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          build_plan_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"

          printf '%s=%s\n' \
            NXQ_NOTIFICATION_ADAPTER_URL "${function_base_url}/notification-provider-adapter" \
            NXQ_NOTIFICATION_ADAPTER_TOKEN "$notification_token" \
            NXQ_MALWARE_SCAN_ADAPTER_URL "${function_base_url}/malware-scan-provider-adapter" \
            NXQ_MALWARE_SCAN_ADAPTER_TOKEN "$malware_token" \
            NXQ_PROVIDER_HEALTH_ADAPTER_URL "${function_base_url}/provider-health-adapter" \
            NXQ_PROVIDER_HEALTH_ADAPTER_TOKEN "$provider_health_token" \
            NXQ_BUILD_PLAN_AI_ADAPTER_URL "${function_base_url}/generate-business-build-plan" \
            NXQ_BUILD_PLAN_AI_ADAPTER_TOKEN "$build_plan_token" \
            > "$secrets_file"

          npx --no-install supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --env-file "$secrets_file"
          rm -f "$secrets_file"

          npx --no-install supabase secrets list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output-format json > "$secret_names_file"
          node scripts/check-runtime-stage-readiness.mjs \
            --profile=business-internal-provider-adapters \
            --supabase-secrets-json="$secret_names_file"
          echo "Configured eight protected internal adapter names; no value was printed."
          echo "Scheduled provider-health checks may begin after this action and require separate authorization before it is run."

      - name: Run zero-Netlify staging evidence suite
        if: inputs.action == 'run_evidence_suite'
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          output="$RUNNER_TEMP/nxq-staging-evidence.json"
          code="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 180 \
            -X POST "${base}/run-staging-evidence-suite" \
            -H "Content-Type: application/json" \
            -H "x-nxq-worker-token: ${NXQ_AUTOMATION_WORKER_TOKEN}" \
            --data '{"source":"github_actions_manual_staging_evidence"}')"
          cat "$output"
          test "$code" = "200" || { echo "Staging evidence suite failed with HTTP $code"; exit 1; }
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!r.ok||r.netlify_calls!==0||r.production_changed!==false||r.fixtures_removed!==true)process.exit(1)' "$output"

      - name: Dispatch queued staging workers externally
        if: inputs.action == 'dispatch_workers'
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          for fn in provision-project-infrastructure prepare-build-plan build-business-website promote-business-production; do
            echo "Dispatching $fn..."
            response_file="$RUNNER_TEMP/${fn}.json"
            http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "x-nxq-worker-token: ${NXQ_AUTOMATION_WORKER_TOKEN}" \
              --data '{"source":"github-actions-staging-dispatch"}' \
              "${base_url}/${fn}")
            cat "$response_file"
            echo
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "$fn returned HTTP $http_code"
              exit 1
            fi
          done

      - name: Final safety note
        run: |
          echo "NXQ Supabase staging action completed: ${{ inputs.action }}"
          echo "This workflow targets nxq-staging only. It does not merge GitHub branches, publish Netlify sites (preview or production), change DNS, enable billing, or mark QA runs passed."
