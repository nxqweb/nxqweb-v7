name: NXQ Build Plan Staging Fallback

on:
  push:
    branches:
      - safe/checkpoint-autonomy-wave35-sales
    paths:
      - .github/workflows/one-shot-build-plan-staging-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/checkpoint-autonomy-wave35-sales
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add deterministic staging-only adapter fallback
        shell: bash
        env:
          HELPER_B64: 
          OLD_B64: 
          NEW_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('supabase/functions/generate-business-build-plan/index.ts')
          s = p.read_text()
          helper = base64.b64decode(os.environ['HELPER_B64']).decode()
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          marker = 'Deno.serve(async (request) => {'
          if 'function stagingFallback(request: BuildPlanRequest)' not in s:
              if marker not in s:
                  raise SystemExit('Deno serve marker missing; refusing ambiguous patch')
              s = s.replace(marker, helper + marker, 1)
          if old not in s:
              raise SystemExit('Provider-config block missing; refusing ambiguous patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Lint adapter
        run: npx eslint supabase/functions/generate-business-build-plan/index.ts --max-warnings=0
      - name: Validate runtime contracts
        run: npm run test:runtime-stage
      - name: Verify diff
        run: git diff --check && git diff -- supabase/functions/generate-business-build-plan/index.ts
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/generate-business-build-plan/index.ts; then
            echo "No adapter changes needed."
            exit 0
          fi
          git config user.name "NXQ Safe CI"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/generate-business-build-plan/index.ts
          git commit -m "fix: add staging-only build-plan adapter fallback"
          git push origin HEAD:safe/checkpoint-autonomy-wave35-sales
