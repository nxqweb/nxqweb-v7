name: NXQ Security Audit

on:
  push:
    branches:
      - "safe/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 13 1 * *" # monthly, on the 1st: a full re-scan even when no code changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend and Edge-facing security audit
        run: npm run test:security
      - name: Database privilege security audit
        run: node scripts/audit-database-security.mjs
      - name: Runtime outbound and provider security contract
        run: node scripts/validate-runtime-security-hardening.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Tenant isolation contract
        run: node scripts/validate-tenant-isolation-contract.mjs
      - name: Client file security contract
        run: node scripts/validate-file-security-contract.mjs
      - name: Denial hard-stop contract
        run: node scripts/validate-denial-hard-stop-contract.mjs
      - name: Watch what this change touched (secret-looking values fail; sensitive files get a notice)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-$BEFORE}"
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            node scripts/check-sensitive-changes.mjs --range "${base}..${GITHUB_SHA}"
          else
            node scripts/check-sensitive-changes.mjs --tree
          fi
      - name: Monthly full scan of everything checked in
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-sensitive-changes.mjs --tree
      - name: Monthly full dependency audit (including build tools)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=high
