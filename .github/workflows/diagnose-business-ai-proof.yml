name: NXQ Business AI Proof Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: nxq-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Diagnose run 172 Business AI evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          set +x

          node --input-type=module <<'NODE'
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN || "";
          const projectRef = process.env.SUPABASE_PROJECT_REF || "";
          if (!accessToken || !projectRef) {
            console.log("INCONCLUSIVE business-build-plan-ai-run-172");
            process.exit(1);
          }

          const query = `
            select
              coalesce(
                heartbeat_at >= '2026-09-02T22:20:53Z'::timestamptz
                and heartbeat_at <= '2026-09-02T22:21:10Z'::timestamptz,
                false
              ) as matches_run_172,
              coalesce((metadata->>'provider_call_proven')::boolean, false) as provider_call_proven,
              coalesce((metadata->>'provider_configured')::boolean, false) as provider_configured,
              coalesce((metadata->>'staging_fallback')::boolean, false) as staging_fallback
            from public.automation_worker_heartbeats
            where worker_key = 'generate-business-build-plan'
              and execution_target = 'ai'
            limit 1;
          `;

          let response;
          try {
            response = await fetch(
              `https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}/database/query/read-only`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ query }),
              },
            );
          } catch {
            console.log("INCONCLUSIVE business-build-plan-ai-run-172");
            process.exit(1);
          }

          if (!response.ok) {
            console.log("INCONCLUSIVE business-build-plan-ai-run-172");
            process.exit(1);
          }

          let payload;
          try {
            payload = await response.json();
          } catch {
            console.log("INCONCLUSIVE business-build-plan-ai-run-172");
            process.exit(1);
          }

          const rows = Array.isArray(payload)
            ? payload
            : Array.isArray(payload?.result)
              ? payload.result
              : Array.isArray(payload?.data)
                ? payload.data
                : [];
          const row = rows[0] || {};

          if (row.matches_run_172 !== true) {
            console.log("INCONCLUSIVE business-build-plan-ai-run-172");
            process.exit(1);
          }

          if (
            row.provider_call_proven === true
            && row.provider_configured === true
            && row.staging_fallback === false
          ) {
            console.log("REAL_PROVIDER_CALL business-build-plan-ai-run-172");
            process.exit(0);
          }

          if (row.provider_call_proven === false && row.staging_fallback === true) {
            console.log("STAGING_FALLBACK business-build-plan-ai-run-172");
            process.exit(0);
          }

          console.log("INCONCLUSIVE business-build-plan-ai-run-172");
          process.exit(1);
          NODE

      - name: Safety note
        run: |
          echo "Read-only diagnostic only: no provider call, deployment, migration application, Netlify call, worker dispatch, production change, or secret display occurred."
