name: NXQ Commerce Preview Safety

on:
  push:
    branches:
      - safe/checkpoint-autonomy-wave35-sales
    paths:
      - .github/workflows/one-shot-commerce-preview-safety.yml
      - scripts/patch-commerce-preview-safety.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/checkpoint-autonomy-wave35-sales
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Commerce preview safety patch
        run: python scripts/patch-commerce-preview-safety.py
      - name: Install dependencies
        run: npm ci
      - name: Lint Commerce worker
        run: npx eslint supabase/functions/provision-storefront/index.ts --max-warnings=0
      - name: Commit hardened Commerce worker
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- supabase/functions/provision-storefront/index.ts; then
            echo "No Commerce preview changes required."
            exit 0
          fi
          git config user.name "NXQ Safe CI"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/provision-storefront/index.ts
          git commit -m "fix: keep Commerce previews off production main"
          git push origin HEAD:safe/checkpoint-autonomy-wave35-sales
