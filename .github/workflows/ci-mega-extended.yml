name: NXQ Mega Extended CI

on:
  push:
    branches:
      - safe/mega-autonomy-pass
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/mega-autonomy-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch owner QA route when missing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          if 'OwnerQaLifecycle' not in s:
              s=s.replace(
                  'const OwnerProviderHealth = named(() => import("./pages/OwnerProviderHealth"), "OwnerProviderHealth");',
                  'const OwnerProviderHealth = named(() => import("./pages/OwnerProviderHealth"), "OwnerProviderHealth");\nconst OwnerQaLifecycle = named(() => import("./pages/OwnerQaLifecycle"), "OwnerQaLifecycle");'
              )
              s=s.replace(
                  '  if (path === "/owner/launch-readiness") return <OwnerProtectedRoute><OwnerLaunchReadiness /></OwnerProtectedRoute>;',
                  '  if (path === "/owner/launch-readiness") return <OwnerProtectedRoute><OwnerLaunchReadiness /></OwnerProtectedRoute>;\n  if (path === "/owner/qa-lifecycle") return <OwnerProtectedRoute><OwnerQaLifecycle /></OwnerProtectedRoute>;'
              )
              s=s.replace(
                  '<a className="owner-plan-change-shortcut" href="/owner/launch-readiness" style={{ bottom: "22.75rem" }}>Launch readiness</a>',
                  '<a className="owner-plan-change-shortcut" href="/owner/launch-readiness" style={{ bottom: "22.75rem" }}>Launch readiness</a><a className="owner-plan-change-shortcut" href="/owner/qa-lifecycle" style={{ bottom: "26.25rem" }}>Autonomous QA</a>'
              )
              p.write_text(s)
          if 'OwnerQaLifecycle' not in p.read_text() or '"/owner/qa-lifecycle"' not in p.read_text():
              raise SystemExit('Owner QA route patch did not apply cleanly.')
          PY
      - name: Wave 14 classifier contract
        run: node scripts/validate-autonomy-ops-wave14-contract.mjs
      - name: Extended autonomy safety contract
        run: node scripts/validate-autonomy-ops-wave15-contract.mjs
      - name: Wave 16 classifier readiness hardening
        run: node scripts/validate-autonomy-ops-wave16-contract.mjs
      - name: Wave 17 ordered billing hardening
        run: node scripts/validate-autonomy-ops-wave17-contract.mjs
      - name: Wave 18 consecutive QA orchestrator
        run: node scripts/validate-autonomy-ops-wave18-contract.mjs
      - name: Generated Business site quality
        run: node scripts/validate-business-generated-site-quality.mjs
      - name: Zero-warning lint
        run: npm run lint -- --max-warnings=0
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: Production bundle budget
        run: node scripts/check-production-bundle-budget.mjs
      - name: Commit verified owner QA route
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/App.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat: route owner autonomous QA lifecycle"
          git push origin HEAD:safe/mega-autonomy-pass
