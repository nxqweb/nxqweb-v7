name: One-shot family Netlify config

on:
  push:
    branches:
      - safe/commerce-live-storefront

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/safe/commerce-live-storefront'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch family-aware Netlify settings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/provision-project-infrastructure/index.ts')
          s = p.read_text()
          s = s.replace('async function createNetlifySite(repositoryFullName: string) {', 'async function createNetlifySite(repositoryFullName: string, familySlug: string) {')
          s = s.replace('  const siteName = slugify(repositoryFullName.split("/")[1]);\n  const created', '  const siteName = slugify(repositoryFullName.split("/")[1]);\n  const buildCommand = familySlug === "business" ? "" : "npm run build";\n  const publishDirectory = familySlug === "business" ? "." : "dist";\n  const created')
          s = s.replace('        cmd: "npm run build",\n        dir: "dist",', '        cmd: buildCommand,\n        dir: publishDirectory,')
          s = s.replace('netlifySite = await createNetlifySite(repositoryFullName);', 'netlifySite = await createNetlifySite(repositoryFullName, familySlug);')
          p.write_text(s)
          PY
      - run: npx eslint supabase/functions/provision-project-infrastructure/index.ts --max-warnings=0
      - run: node scripts/validate-project-infrastructure-contract.mjs
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/provision-project-infrastructure/index.ts
          git diff --cached --quiet || git commit -m "Make Netlify provisioning family-aware"
          git push
